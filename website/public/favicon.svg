<svg viewBox="0 0 200 200" width="120" height="120" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="44" fill="#0E0C1B"/>
  <defs>
    <linearGradient id="foldLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="foldDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="foldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Left Wing -->
  <polygon points="46,42 74,58 74,162 46,146" fill="url(#foldLeft)"/>
  <!-- Isometric Center Cross -->
  <polygon points="74,58 126,142 126,162 74,78" fill="url(#foldDiag)" opacity="0.9"/>
  <!-- Right Wing -->
  <polygon points="126,38 154,54 154,158 126,142" fill="url(#foldRight)"/>
